<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | Express Cargo</title>
    <link rel="icon" type="image/png" href="images/wjXOlIaohcqn62UI4e0nXaIQdcTHyC2S9TnQ7eOc.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            500: '#0284c7',
                            600: '#0B1F3A',
                            700: '#071526',
                            800: '#050f1d',
                            900: '#03080f',
                        },
                        secondary: {
                            500: '#D97706',
                            600: '#B45309',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-[#071526] relative overflow-hidden font-sans text-slate-200">
    <!-- Ambient glowing backgrounds -->
    <div class="pointer-events-none absolute -top-40 -left-40 h-96 w-96 rounded-full bg-primary-500/10 blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-40 -right-40 h-96 w-96 rounded-full bg-secondary-500/10 blur-3xl"></div>

    <div class="max-w-md w-full space-y-8 bg-[#0B1F3A]/90 border border-white/10 p-8 sm:p-10 rounded-3xl backdrop-blur-xl shadow-2xl relative z-10">
        <!-- Logo & Header -->
        <div class="text-center">
            <a href="index.html" class="inline-block group mb-6">
                <img src="images/logo-footer.png" alt="Express Cargo" class="h-12 w-auto mx-auto object-contain transition-transform group-hover:scale-105">
            </a>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Admin Portal Access</h2>
            <p class="mt-2 text-sm text-slate-400">Secure real-time logistics telemetry & cargo management</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="hidden rounded-2xl p-4 text-sm font-medium transition-all duration-300"></div>

        <!-- Login Form -->
        <form id="loginForm" class="mt-8 space-y-5">
            <div>
                <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <input id="email" name="email" type="email" autocomplete="email" required
                           placeholder="Enter admin email address"
                           class="block w-full pl-11 pr-4 py-3.5 bg-slate-900/80 border border-white/10 rounded-2xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500 transition-all">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                           placeholder="Enter your password"
                           class="block w-full pl-11 pr-11 py-3.5 bg-slate-900/80 border border-white/10 rounded-2xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500 transition-all">
                    <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-slate-300">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-slate-400 cursor-pointer">
                    <input type="checkbox" checked class="rounded border-white/10 bg-slate-900 text-primary-500 focus:ring-0">
                    <span>Keep me logged in</span>
                </label>
                <a href="#" onclick="alert('Please contact the server administrator to reset credentials.'); return false;" class="text-xs font-semibold text-secondary-500 hover:text-secondary-400 transition-colors">Forgot password?</a>
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full flex justify-center items-center gap-2 py-4 px-6 border border-transparent rounded-2xl shadow-lg text-sm font-bold text-white bg-gradient-to-r from-primary-500 to-sky-600 hover:from-primary-600 hover:to-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-all duration-300 hover:-translate-y-0.5">
                <i class="fas fa-shield-alt"></i>
                <span id="btnText">Sign In to Dashboard</span>
            </button>
        </form>

        <div class="pt-4 border-t border-white/10 text-center">
            <a href="index.html" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-400 hover:text-white transition-colors">
                <i class="fas fa-arrow-left"></i>
                Back to Public Website
            </a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        // Toggle password visibility
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // If already logged in, redirect to admin dashboard
        if (localStorage.getItem('express_cargo_token')) {
            window.location.href = 'admin.html';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Authenticating...';
            alertBox.className = 'hidden';

            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success && data.token) {
                    localStorage.setItem('express_cargo_token', data.token);
                    localStorage.setItem('express_cargo_user', JSON.stringify(data.user || {}));
                    
                    alertBox.className = 'rounded-2xl p-4 text-sm font-medium bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-center';
                    alertBox.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Login successful! Redirecting to dashboard...';

                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 800);
                } else {
                    alertBox.className = 'rounded-2xl p-4 text-sm font-medium bg-red-500/20 border border-red-500/40 text-red-300 text-center';
                    alertBox.innerHTML = '<i class="fas fa-exclamation-circle mr-2"></i> ' + (data.error || data.message || 'Invalid email or password.');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Sign In to Dashboard';
                }
            } catch (err) {
                alertBox.className = 'rounded-2xl p-4 text-sm font-medium bg-red-500/20 border border-red-500/40 text-red-300 text-center';
                alertBox.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i> Server connection failed. Please check backend status.';
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In to Dashboard';
            }
        });
    </script>
</body>
</html>
